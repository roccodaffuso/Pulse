name: Feature request
description: Suggest an improvement to Pulse Vitals
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user need rather than sharing personal health data. Issues are public.
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you handle this today?
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Most relevant surface
      options:
        - iPhone app
        - Apple Watch app
        - Widget
        - Apple Watch complication
        - Not sure
    validations:
      required: true
